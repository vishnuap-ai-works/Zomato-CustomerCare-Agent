services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MCP_SERVER_URL=http://mcp_server:8003/sse
    depends_on:
      - mcp_server

  mcp_server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - USER_SERVICE_URL=http://user_management:8002
      - ORDER_SERVICE_URL=http://order_service:8001
      - PORT=8003
    depends_on:
      - user_management
      - order_service

  user_management:
    build:
      context: .
      dockerfile: mock_services/zomato_user_management_service/Dockerfile
    ports:
      - "8002:8002"

  order_service:
    build:
      context: .
      dockerfile: mock_services/zomato_order_service/Dockerfile
    ports:
      - "8001:8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://agent:8000
    depends_on:
      - agent
